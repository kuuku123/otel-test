receivers:
  # OTLP Receiver: Accepts traces, metrics, and logs via gRPC and HTTP
  # Used by Pure SDK, Java Agent, and OpenTelemetry JMX Scraper (port 4318)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Optional Reference: OpenTelemetry Collector Contrib JMX Receiver (Deprecated upstream)
  # NOTE: To use this directly inside the collector, the collector container must have a JRE installed.
  # The modern standard recommended by OpenTelemetry is using opentelemetry-jmx-scraper to send OTLP to :4318 above.
  # jmx:
  #   jar_path: /opt/opentelemetry-jmx-metrics.jar
  #   endpoint: host.docker.internal:9999
  #   target_system: jvm
  #   collection_interval: 5s

processors:
  batch:
    timeout: 1s
    send_batch_size: 10

exporters:
  # Debug: Output detailed telemetry to collector console logs
  debug:
    verbosity: detailed

  # Traces -> Send to Grafana Tempo via OTLP gRPC
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Metrics -> Expose for Prometheus to scrape
  prometheus:
    endpoint: 0.0.0.0:8889

  # Logs -> Send to Grafana Loki via OTLP HTTP
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/loki]
